<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>죽음의 먼지를 멈춰라! 미래 수송수단 연구소</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body { margin: 0; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in-up { animation: fadeInUp .25s ease-out; }
    .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
const { useState, useRef, useEffect } = React;
 
 
// ▼▼▼ Apps Script를 "웹 앱"으로 배포한 뒤 나온 주소(/exec로 끝남)를 따옴표 안에 붙여넣으세요 ▼▼▼
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxNwfXX6A9lhL33itj9FtC_vj4CXqdTpexYOyrAL9cIBmwndA9Fn489zD4sk_ZV_Io/exec';
// ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲
 
// Apps Script 서버 함수를 호출합니다. (text/plain으로 보내야 브라우저 보안 검사에 막히지 않습니다)
const serverCall = async (name, ...args) => {
  let res;
  try {
    res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: name, args })
    });
  } catch (e) {
    throw new Error('서버에 연결하지 못했어요. 인터넷 연결이나 GAS_URL 주소를 확인해 주세요.');
  }
  let data;
  try {
    data = await res.json();
  } catch (e) {
    throw new Error('서버 응답을 읽지 못했어요. Apps Script 배포 권한이 "모든 사용자"인지 확인해 주세요.');
  }
  if (!data.ok) throw new Error(data.error || '서버 오류가 발생했어요.');
  return data.result;
};
 
const App = () => {
  const [step, setStep] = useState(1);
  const [formData, setFormData] = useState({
    name: '',
    designer: '', 
    target: '',
    energies: [], 
    energyCustom: '',
    eco: '',
    special: '',
    drive: '', 
    steer: '', 
    brake: '', 
    imageSrc: null,
    imageMimeType: null,
    imageDataBase64: null,
  });
 
  const [aiFeedback, setAiFeedback] = useState(null);
  const [judgment, setJudgment] = useState(null); 
  const [revisedData, setRevisedData] = useState({
    eco: '',
    special: '',
    drive: '',
    steer: '',
    brake: '',
  });
  
  // STEP 5 상태 변수들 (다중 후보 이미지 관리)
  const [candidateImages, setCandidateImages] = useState([]);
  const [currentCandidateIndex, setCurrentCandidateIndex] = useState(0);
  const [selectedImage, setSelectedImage] = useState(null);
  const [generationCount, setGenerationCount] = useState(0);
 
  const [finalImage, setFinalImage] = useState(null);
  const [padletUrl, setPadletUrl] = useState('#');
  const [isLoading, setIsLoading] = useState(false);
  const [loadingMessage, setLoadingMessage] = useState('');
  const [error, setError] = useState('');
  
  const [isEditingPoster, setIsEditingPoster] = useState(false);
  const [editablePosterData, setEditablePosterData] = useState(null);
 
  const [currentRecordId, setCurrentRecordId] = useState(null);
  // 같은 학생 활동은 처음부터 끝까지 반드시 같은 recordId를 사용합니다.
  // 저장이 거의 동시에 두 번 호출되어도 새 ID가 생기지 않도록 ref로 고정합니다.
  const recordIdRef = useRef(null);
  const [clickCount, setClickCount] = useState(0);
  const [clickTimer, setClickTimer] = useState(null);
  const [showTeacherLogin, setShowTeacherLogin] = useState(false);
  const [teacherPassword, setTeacherPassword] = useState('');
  const [isTeacherMode, setIsTeacherMode] = useState(false);
  const [teacherToken, setTeacherToken] = useState('');
  const [savedRecords, setSavedRecords] = useState([]);
  const [viewingRecord, setViewingRecord] = useState(null);
  const [deleteTargetId, setDeleteTargetId] = useState(null);
  const [clearAllConfirmStep, setClearAllConfirmStep] = useState(0);
 
  useEffect(() => {
    if (clickCount >= 3) {
      setShowTeacherLogin(true);
      setClickCount(0);
    }
  }, [clickCount]);
 
  const loadRecords = async (token = teacherToken) => {
    try {
      const data = await serverCall('getStudentRecords', token);
      setSavedRecords(data || []);
    } catch (e) {
      console.error("기록 불러오기 실패", e);
      alert(e.message || '학생 기록을 불러오지 못했습니다.');
    }
  };
 
  const saveRecordToLocal = async (posterData, posterDataUrl = null) => {
    try {
      const finalData = judgment === 'revise' ? { ...formData, ...revisedData } : formData;
      const designerName = posterData?.designer?.trim() !== '' ? posterData?.designer : (finalData.designer?.trim() !== '' ? finalData.designer : '미래 설계자');
      if (!recordIdRef.current) {
        recordIdRef.current =
          currentRecordId ||
          `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
      }
      const id = recordIdRef.current;
 
      const newRecord = {
        id,
        timestamp: new Date().toISOString(),
        studentName: designerName,
        vehicleName: posterData?.name || finalData.name,
        target: finalData.target,
        energies: finalData.energies,
        energyCustom: finalData.energyCustom,
        eco: finalData.eco,
        special: finalData.special,
        drive: finalData.drive,
        steer: finalData.steer,
        brake: finalData.brake,
        imageSrc: finalData.imageSrc,
        aiFeedback,
        judgment,
        revisedData: judgment === 'revise' ? revisedData : null,
        finalImage: selectedImage || finalImage || candidateImages[currentCandidateIndex] || null,
        candidateImages,
        posterData,
        posterDataUrl,
        status: '완료'
      };
 
      const result = await serverCall('saveStudentRecord', newRecord);
      const savedId = result?.id || id;
      recordIdRef.current = savedId;
      setCurrentRecordId(savedId);
      return savedId;
    } catch (e) {
      console.warn("공용 저장 실패:", e);
      alert('학생 기록 저장 중 문제가 생겼어요. ' + (e.message || ''));
      return null;
    }
  };
 
  useEffect(() => {
    serverCall('getAppConfig').then(cfg => {
      if (cfg?.padletUrl) setPadletUrl(cfg.padletUrl);
    }).catch(console.error);
  }, []);
 
  const fileInputRef = useRef(null);
  const posterRef = useRef(null); 
 
  const steps = [
    "구상하기", "AI 점검", "나의 판단", "최종 설계", "실물화", "완성"
  ];
 
  const ProgressBar = () => (
    <div className="w-full bg-emerald-50 py-4 px-6 border-b border-emerald-100 sticky top-0 z-10">
      <div className="max-w-4xl mx-auto flex items-center justify-between">
        {steps.map((s, index) => (
          <div key={index} className="flex flex-col items-center">
            <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm
              ${step === index + 1 ? 'bg-emerald-500 text-white shadow-md transform scale-110' : 
                step > index + 1 ? 'bg-emerald-200 text-emerald-700' : 'bg-gray-200 text-gray-400'}`}>
              {index + 1}
            </div>
            <span className={`text-xs mt-1 font-medium hidden md:block
              ${step === index + 1 ? 'text-emerald-700' : 'text-gray-500'}`}>
              {s}
            </span>
          </div>
        ))}
      </div>
    </div>
  );
 
  const handleHeaderClick = () => {
    setClickCount(prev => prev + 1);
    if (clickTimer) clearTimeout(clickTimer);
    const timer = setTimeout(() => setClickCount(0), 1000);
    setClickTimer(timer);
  };
 
  const Header = () => (
    <div className="text-center mb-8 pt-6">
      <h1 
        className="text-2xl md:text-4xl font-extrabold text-emerald-800 mb-2 tracking-tight select-none cursor-default"
        onClick={handleHeaderClick}
      >
        🌱 죽음의 먼지를 멈춰라! 미래 수송수단 연구소
      </h1>
      <p className="text-sm md:text-base text-gray-600 mb-4 px-4 max-w-2xl mx-auto break-keep">
        『죽음의 먼지가 내려와요』 속 도시의 수송수단을 친환경 수송수단으로 바꾸어 이야기의 미래를 바꾸어 봅시다.
      </p>
      <div className="inline-block bg-orange-100 border border-orange-300 text-orange-800 px-4 py-2 rounded-full font-bold shadow-sm">
        오늘의 미션: 🚨 죽음의 먼지가 내려오지 않는 미래를 만들어라!
      </div>
    </div>
  );
 
  const handleInputChange = (e) => {
    const { name, value } = e.target;
    setFormData(prev => ({ ...prev, [name]: value }));
  };
 
  const handleEnergyToggle = (type) => {
    setFormData(prev => {
      const energies = prev.energies.includes(type)
        ? prev.energies.filter(t => t !== type)
        : [...prev.energies, type];
      return { ...prev, energies };
    });
  };
 
  const handleImageUpload = (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onloadend = () => {
        const base64String = reader.result;
        setFormData(prev => ({ 
          ...prev, 
          imageSrc: base64String,
          imageMimeType: file.type,
          imageDataBase64: base64String.split(',')[1]
        }));
      };
      reader.readAsDataURL(file);
    }
  };
 
  const requestAiFeedback = async () => {
    const requiredFields = ['name', 'target', 'eco'];
    const missing = requiredFields.filter(field => !formData[field] || formData[field].trim() === '');
    if (missing.length > 0 || formData.energies.length === 0 || !formData.imageSrc) {
      alert("필수 항목에 입력하지 않은 빈칸이 있거나 에너지를 선택하지 않았거나 그림을 올리지 않았습니다. 모두 채워주세요!");
      return;
    }
 
    setIsLoading(true);
    setLoadingMessage("AI가 설계도를 꼼꼼히 살펴보고 있어요...");
    setError('');
    try {
      const parsed = await serverCall('requestAiFeedbackServer', {
        name: formData.name,
        target: formData.target,
        energies: formData.energies,
        energyCustom: formData.energyCustom,
        eco: formData.eco,
        special: formData.special,
        drive: formData.drive,
        steer: formData.steer,
        brake: formData.brake
      });
      setAiFeedback(parsed);
      setStep(2);
    } catch (err) {
      setError("앗, AI와 통신하는 중 문제가 생겼어요. 잠시 후 다시 시도해주세요.");
      console.error(err);
    } finally {
      setIsLoading(false);
    }
  };
 
  // 실물화 이미지 생성 함수 (최대 2회, 후보 목록에 추가)
  // 실물화 이미지 생성 함수 (최대 2회, 후보 목록에 추가)
  const requestImageGeneration = async () => {
    if (generationCount >= 2) return;
 
    setIsLoading(true);
    setLoadingMessage(`✨ 여러분의 상상이 현실이 되는 중입니다... (${generationCount + 1}/2회 생성 중)`);
    setError('');
 
    const finalData = judgment === 'revise' ? { ...formData, ...revisedData } : formData;
    try {
      const result = await serverCall('requestImageGenerationServer', {
        name: finalData.name,
        energies: finalData.energies,
        energyCustom: finalData.energyCustom,
        eco: finalData.eco,
        special: finalData.special,
        drive: finalData.drive,
        steer: finalData.steer,
        brake: finalData.brake,
        imageMimeType: formData.imageMimeType,
        imageDataBase64: formData.imageDataBase64
      });
      const generatedImageUri = `data:${result.mimeType};base64,${result.data}`;
      const newCandidates = [...candidateImages, generatedImageUri];
      setCandidateImages(newCandidates);
      setCurrentCandidateIndex(newCandidates.length - 1);
      setGenerationCount(prev => prev + 1);
      setStep(5);
    } catch (err) {
      setError("앗, 이미지를 만드는 중 문제가 생겼어요. 다시 시도해주세요.");
      console.error(err);
    } finally {
      setIsLoading(false);
    }
  };
 
  // 학생이 선택한 이미지로 최종 결정하고 STEP 6 완성 단계로 이동
  // 학생이 선택한 이미지로 최종 결정하고 STEP 6 완성 단계로 이동
  const handleConfirmSelectedImage = (imageUri) => {
    try {
      const chosenImage = imageUri || candidateImages[currentCandidateIndex] || '';
      if (!chosenImage) {
        alert('선택된 이미지가 없습니다. 이미지를 다시 선택해 주세요.');
        return;
      }
 
      const finalData = judgment === 'revise' ? { ...formData, ...revisedData } : { ...formData };
 
      const summarizeText = (text, maxLength = 60) => {
        const cleaned = String(text || '').trim();
        if (!cleaned) return '';
        if (cleaned.length <= maxLength) return cleaned;
        const firstSentence = cleaned.split(/[.!?]\s/)[0];
        if (firstSentence && firstSentence.length <= maxLength + 10) {
          return firstSentence.endsWith('.') ? firstSentence : firstSentence + '.';
        }
        return cleaned.substring(0, maxLength) + '...';
      };
 
      const ecoPoints = String(finalData.eco || '')
        .split(/[.!?\n]/)
        .map(s => s.trim())
        .filter(Boolean)
        .slice(0, 3);
 
      if (ecoPoints.length === 0) {
        ecoPoints.push('친환경 에너지 활용');
      }
 
      const posterData = {
        name: finalData.name || '',
        designer: finalData.designer || '',
        target: summarizeText(finalData.target, 50),
        ecoPoints: ecoPoints.join('\n'),
        special: finalData.special ? summarizeText(finalData.special, 50) : '',
        drive: finalData.drive ? summarizeText(finalData.drive, 50) : '',
        steer: finalData.steer ? summarizeText(finalData.steer, 50) : '',
        brake: finalData.brake ? summarizeText(finalData.brake, 50) : '',
      };
 
      setSelectedImage(chosenImage);
      setFinalImage(chosenImage);
      setEditablePosterData(posterData);
      setIsEditingPoster(false);
      setError('');
      setStep(6);
 
      // 학생 기록은 비동기로 저장합니다. 화면 전환을 막지 않습니다.
      setTimeout(() => {
        saveRecordToLocal(posterData).catch?.(() => {});
      }, 0);
    } catch (err) {
      console.error('최종 이미지 선택 처리 오류', err);
      setError('완성 화면으로 이동하는 중 문제가 생겼어요. 다시 한 번 눌러 주세요.');
    }
  };
 
  const currentPosterDataSafe = () => {
    const finalData = judgment === 'revise' ? { ...formData, ...revisedData } : formData;
    return editablePosterData || {
      name: finalData.name || '', designer: finalData.designer || '', target: finalData.target || '',
      ecoPoints: finalData.eco || '', special: finalData.special || '', drive: finalData.drive || '',
      steer: finalData.steer || '', brake: finalData.brake || ''
    };
  };
 
  const handleDownloadPoster = async () => {
    if (!posterRef.current || !window.html2canvas) {
      alert("포스터 저장 기능을 준비 중입니다. 잠시 후 다시 시도해주세요.");
      return;
    }
    
    setIsLoading(true);
    setLoadingMessage("멋진 포스터를 이미지로 굽고 있어요...");
    
    try {
      const el = posterRef.current;
 
      // 글꼴과 이미지가 완전히 준비된 뒤에 찍어야 흐릿하거나 빈 칸이 생기지 않습니다.
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      await Promise.all(Array.from(el.querySelectorAll('img')).map(img =>
        img.complete ? Promise.resolve() : new Promise(r => { img.onload = r; img.onerror = r; })
      ));
 
      // 해상도: 기본 3배. 단, 태블릿 브라우저의 캔버스 크기 한계(약 1,600만 픽셀)를 넘지 않게 자동 조절합니다.
      const MAX_PIXELS = 14000000;
      const w = el.offsetWidth, h = el.offsetHeight;
      const scale = Math.max(1.5, Math.min(3, Math.sqrt(MAX_PIXELS / (w * h))));
 
      const canvas = await window.html2canvas(el, {
        scale,
        useCORS: true,
        backgroundColor: '#f8fafc',
        windowWidth: Math.max(document.documentElement.clientWidth, w + 100),
        scrollX: 0,
        scrollY: -window.scrollY
      });
      const image = canvas.toDataURL("image/png");
      // 드라이브 저장용은 용량을 줄인 고화질 JPG로 보내 저장 시간을 줄입니다.
      const imageForDrive = canvas.toDataURL("image/jpeg", 0.92);
      await saveRecordToLocal(editablePosterData || currentPosterDataSafe(), imageForDrive);
      const link = document.createElement('a');
      link.href = image;
      link.download = `${editablePosterData?.name || formData.name}_설계포스터.png`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    } catch (err) {
      console.error("포스터 저장 실패:", err);
      alert("포스터를 저장하는 데 문제가 발생했습니다. 브라우저 설정이나 용량 문제를 확인해주세요.");
    } finally {
      setIsLoading(false);
    }
  };
 
  const renderStep1 = () => (
    <div className="space-y-6">
      <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-emerald-100">
        <h2 className="text-xl font-bold text-emerald-800 mb-6 flex items-center">
          <span className="bg-emerald-100 p-2 rounded-lg mr-3">✏️</span>
          나의 친환경 수송수단 아이디어 스케치
        </h2>
        
        <div className="space-y-5">
          <div className="bg-emerald-50/50 p-5 rounded-xl border border-emerald-100 space-y-5">
            <h3 className="font-bold text-emerald-700 text-lg border-b border-emerald-200 pb-2 mb-4">필수 항목</h3>
            <div>
              <label className="block text-gray-700 font-bold mb-2">① 수송수단 이름은?</label>
              <input type="text" name="name" value={formData.name} onChange={handleInputChange}
                className="w-full p-4 rounded-xl border-2 border-emerald-200 focus:border-emerald-500 focus:ring-0 text-lg transition"
                placeholder="예: 태양빛 씽씽카" />
            </div>
 
            <div>
              <label className="block text-gray-700 font-bold mb-2">② 포스터에 표시될 나의 이름이나 별명은?</label>
              <input type="text" name="designer" value={formData.designer} onChange={handleInputChange}
                className="w-full p-4 rounded-xl border-2 border-emerald-200 focus:border-emerald-500 focus:ring-0 text-lg transition"
                placeholder="예: 김하늘 또는 초록 발명가 (비워두면 '미래 설계자'로 표시됩니다)" />
            </div>
 
            <div>
              <label className="block text-gray-700 font-bold mb-2">③ 누구 또는 무엇을 어떻게 이동시키나요?</label>
              <textarea name="target" value={formData.target} onChange={handleInputChange} rows="2"
                className="w-full p-4 rounded-xl border-2 border-emerald-200 focus:border-emerald-500 focus:ring-0 text-lg transition"
                placeholder="예: 사람 4명을 태우고 도시 안을 이동해요." />
            </div>
 
            <div>
              <label className="block text-gray-700 font-bold mb-3">④ 무엇의 힘으로 움직이나요? (복수 선택 가능)</label>
              <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                {['☀️ 태양 에너지', '⚡ 전기', '💧 수소', '🚲 사람의 힘', '🌬️ 바람', '♻️ 기타'].map(type => {
                  const isSelected = formData.energies.includes(type);
                  return (
                    <button key={type} onClick={() => handleEnergyToggle(type)} type="button"
                      className={`p-4 rounded-xl border-2 font-bold text-base md:text-lg transition-all

              <div className="text-4xl mb-4">📭</div>
              <p className="text-xl font-bold text-gray-500">아직 저장된 학생 활동 기록이 없습니다.</p>
            </div>
          )}
        </div>
 
        {savedRecords.length > 0 && (
          <div className="border-t-2 border-gray-100 pt-8 text-center">
            <button 
              onClick={() => setClearAllConfirmStep(1)}
              className="bg-red-50 hover:bg-red-100 border border-red-200 text-red-700 font-extrabold px-8 py-4 rounded-2xl transition shadow-sm text-lg"
            >
              ⚠️ 전체 기록 초기화
            </button>
          </div>
        )}
      </div>
    );
  };
 
  const renderTeacherModals = () => {
    return (
      <>
        {showTeacherLogin && (
          <div className="fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl p-8 w-full max-w-sm shadow-2xl animate-fade-in-up border-2 border-indigo-200">
              <h3 className="text-2xl font-black text-gray-800 mb-2 flex items-center justify-center">
                <span className="mr-2">🔒</span> 교사 모드
              </h3>
              <p className="text-gray-500 mb-6 text-center text-sm font-medium">교사 비밀번호를 입력하세요.</p>
              <input 
                type="password"
                value={teacherPassword}
                onChange={e => setTeacherPassword(e.target.value)}
                onKeyDown={async e => {
                  if (e.key === 'Enter') {
                    try { const auth = await serverCall('verifyTeacherPassword', teacherPassword); if (auth?.ok) { setTeacherToken(auth.token); setIsTeacherMode(true); setShowTeacherLogin(false); setTeacherPassword(''); await loadRecords(auth.token); } else { setTeacherPassword(''); alert('비밀번호가 올바르지 않습니다.'); } } catch(e) { alert(e.message); }
                  }
                }}
                className="w-full p-4 text-center text-2xl tracking-widest rounded-xl border-2 border-gray-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 mb-6 font-bold"
                placeholder="****"
                autoFocus
              />
              <div className="flex gap-3">
                <button 
                  onClick={() => {
                    setShowTeacherLogin(false);
                    setTeacherPassword('');
                  }}
                  className="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-extrabold py-4 rounded-xl transition"
                >
                  취소
                </button>
                <button 
                  onClick={async () => {
                    try { const auth = await serverCall('verifyTeacherPassword', teacherPassword); if (auth?.ok) { setTeacherToken(auth.token); setIsTeacherMode(true); setShowTeacherLogin(false); setTeacherPassword(''); await loadRecords(auth.token); } else { setTeacherPassword(''); alert('비밀번호가 올바르지 않습니다.'); } } catch(e) { alert(e.message); }
                  }}
                  className="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-4 rounded-xl shadow-md transition"
                >
                  확인
                </button>
              </div>
            </div>
          </div>
        )}
 
        {deleteTargetId && (
          <div className="fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl p-8 w-full max-w-sm shadow-2xl animate-fade-in-up">
              <div className="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">🗑️</div>
              <h3 className="text-xl font-black text-center text-gray-900 mb-2">기록 삭제</h3>
              <p className="text-gray-600 text-center mb-8 font-medium">이 학생의 활동 기록을<br/>정말 삭제하시겠습니까?</p>
              <div className="flex gap-3">
                <button 
                  onClick={() => setDeleteTargetId(null)}
                  className="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-extrabold py-4 rounded-xl transition"
                >
                  취소
                </button>
                <button 
                  onClick={async () => {
                    try {
                      await serverCall('deleteStudentRecord', deleteTargetId, teacherToken);
                      setDeleteTargetId(null);
                      await loadRecords(teacherToken);
                    } catch (e) { alert(e.message); }
                  }}
                  className="flex-1 bg-red-500 hover:bg-red-600 text-white font-extrabold py-4 rounded-xl shadow-md transition"
                >
                  삭제하기
                </button>
              </div>
            </div>
          </div>
        )}
 
        {clearAllConfirmStep > 0 && (
          <div className="fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl p-8 w-full max-w-sm shadow-2xl animate-fade-in-up border-2 border-red-200">
              <div className="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                {clearAllConfirmStep === 1 ? '⚠️' : '🚨'}
              </div>
              <h3 className="text-xl font-black text-center text-red-600 mb-2">
                {clearAllConfirmStep === 1 ? '전체 기록 초기화' : '최종 삭제 확인'}
              </h3>
              <p className="text-gray-700 text-center mb-8 font-medium break-keep">
                {clearAllConfirmStep === 1 
                  ? '저장된 모든 학생의 기록을 삭제하시겠습니까?' 
                  : '정말 모든 기록을 삭제합니다. 복구할 수 없습니다. 계속하시겠습니까?'}
              </p>
              <div className="flex gap-3">
                <button 
                  onClick={() => setClearAllConfirmStep(0)}
                  className="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-extrabold py-4 rounded-xl transition"
                >
                  취소
                </button>
                <button 
                  onClick={async () => {
                    if (clearAllConfirmStep === 1) {
                      setClearAllConfirmStep(2);
                    } else {
                      try {
                        await serverCall('clearAllStudentRecords', teacherToken);
                        setSavedRecords([]);
                        setClearAllConfirmStep(0);
                      } catch (e) { alert(e.message); }
                    }
                  }}
                  className="flex-1 bg-red-600 hover:bg-red-700 text-white font-extrabold py-4 rounded-xl shadow-md transition"
                >
                  {clearAllConfirmStep === 1 ? '네, 삭제합니다' : '완전 삭제'}
                </button>
              </div>
            </div>
          </div>
        )}
 
        {viewingRecord && (
          <div className="fixed inset-0 bg-gray-900/70 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl w-full max-w-4xl max-h-[90vh] flex flex-col shadow-2xl animate-fade-in-up overflow-hidden">
              <div className="p-5 sm:p-8 border-b flex justify-between items-center bg-gray-50/80 backdrop-blur">
                <h3 className="text-2xl font-black text-gray-800 flex items-center">
                  <span className="bg-indigo-100 text-indigo-700 p-2 rounded-xl mr-3 text-lg">📝</span>
                  {viewingRecord.studentName} 학생의 작품
                </h3>
                <button 
                  onClick={() => setViewingRecord(null)}
                  className="bg-gray-200 hover:bg-gray-300 text-gray-600 rounded-full w-10 h-10 flex items-center justify-center font-bold transition"
                >
                  ✕
                </button>
              </div>
              
              <div className="p-5 sm:p-8 overflow-y-auto custom-scrollbar flex-1 space-y-8 bg-white">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                  <div className="bg-gray-50 p-4 rounded-2xl border border-gray-100">
                    <p className="font-extrabold text-gray-500 mb-3 flex items-center"><span className="mr-2">✨</span> 최종 선택 실물화 이미지</p>
                    <div className="bg-white p-2 rounded-xl shadow-sm border border-gray-200">
                      {viewingRecord.finalImage ? (
                        <img src={viewingRecord.finalImage} alt="최종 이미지" className="w-full h-auto rounded-lg" />
                      ) : (
                        <div className="py-12 text-center text-gray-400">이미지 없음</div>
                      )}
                    </div>
                  </div>
                  <div className="bg-gray-50 p-4 rounded-2xl border border-gray-100">
                    <p className="font-extrabold text-gray-500 mb-3 flex items-center"><span className="mr-2">✏️</span> 원본 스케치</p>
                    <div className="bg-white p-2 rounded-xl shadow-sm border border-gray-200">
                      {viewingRecord.imageSrc ? (
                        <img src={viewingRecord.imageSrc} alt="원본 스케치" className="w-full h-auto rounded-lg" />
                      ) : (
                        <div className="py-12 text-center text-gray-400">이미지 없음</div>
                      )}
                    </div>
                  </div>
                </div>
 
                {viewingRecord.candidateImages?.length > 1 && (
                  <div className="bg-purple-50/50 p-6 rounded-2xl border border-purple-100">
                    <h4 className="font-black text-purple-800 mb-4">실물화 후보 이미지</h4>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      {viewingRecord.candidateImages.map((img, idx) => (
                        <div key={idx} className="bg-white p-2 rounded-xl border border-purple-100">
                          <div className="text-xs font-bold text-purple-600 mb-2">후보 {idx + 1}</div>
                          <img src={img} alt={`후보 ${idx + 1}`} className="w-full h-auto rounded-lg" />
                        </div>
                      ))}
                    </div>
                  </div>
                )}
 
                <div className="bg-emerald-50/50 p-6 rounded-2xl border border-emerald-100 space-y-4">
                  <h4 className="font-black text-emerald-800 border-b border-emerald-200 pb-2 mb-4">설계 상세 내용</h4>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><span className="font-extrabold text-gray-500 block text-sm">수송수단 이름</span> <span className="font-bold text-lg">{viewingRecord.vehicleName}</span></div>
                    <div><span className="font-extrabold text-gray-500 block text-sm">사용 에너지</span> 
                      <span className="font-bold text-lg text-blue-600">
                        {viewingRecord.energies?.includes('♻️ 기타') 
                          ? [...(viewingRecord.energies.filter(e => e !== '♻️ 기타') || []), viewingRecord.energyCustom].join(', ') 
                          : viewingRecord.energies?.join(', ')}
                      </span>
                    </div>
                  </div>
                  {viewingRecord.target && <div><span className="font-extrabold text-gray-500 block text-sm">이동 대상 및 방법</span> <span className="font-bold text-gray-800">{viewingRecord.target}</span></div>}
                  <div><span className="font-extrabold text-gray-500 block text-sm">환경 보호 방법</span> <span className="font-bold text-gray-800">{viewingRecord.eco}</span></div>
                  {viewingRecord.special && <div><span className="font-extrabold text-gray-500 block text-sm">특별한 기능</span> <span className="font-bold text-gray-800">{viewingRecord.special}</span></div>}
                  
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2 border-t border-emerald-100 border-dashed mt-2">
                    {viewingRecord.drive && <div><span className="font-extrabold text-gray-500 block text-sm">구동 장치</span> <span className="font-bold text-gray-800">{viewingRecord.drive}</span></div>}
                    {viewingRecord.steer && <div><span className="font-extrabold text-gray-500 block text-sm">조향 장치</span> <span className="font-bold text-gray-800">{viewingRecord.steer}</span></div>}
                    {viewingRecord.brake && <div><span className="font-extrabold text-gray-500 block text-sm">제동 장치</span> <span className="font-bold text-gray-800">{viewingRecord.brake}</span></div>}
                  </div>
                </div>
 
                {viewingRecord.finalPoster && (
                  <div className="bg-amber-50/50 p-6 rounded-2xl border border-amber-100">
                    <h4 className="font-black text-amber-800 border-b border-amber-200 pb-2 mb-4">최종 설계 포스터</h4>
                    <img src={viewingRecord.finalPoster} alt="최종 포스터" className="w-full h-auto rounded-xl border border-amber-200 bg-white" />
                  </div>
                )}
 
                {viewingRecord.aiFeedback && (
                  <div className="bg-blue-50/50 p-6 rounded-2xl border border-blue-100">
                    <h4 className="font-black text-blue-800 border-b border-blue-200 pb-2 mb-4">AI 피드백 및 학생의 판단</h4>
                    <div className="space-y-4">
                      <div>
                        <span className="font-extrabold text-blue-600 block text-sm mb-1">👍 AI의 칭찬</span>
                        <p className="text-gray-800 font-medium">{viewingRecord.aiFeedback.compliment}</p>
                      </div>
                      <div>
                        <span className="font-extrabold text-orange-600 block text-sm mb-1">💡 AI의 제안</span>
                        <p className="text-gray-800 font-medium">{viewingRecord.aiFeedback.suggestion}</p>
                      </div>
                      <div className="bg-white p-3 rounded-xl border border-blue-100 flex items-center mt-4">
                        <span className="font-extrabold text-gray-500 mr-3">학생의 선택:</span> 
                        <span className={`font-bold px-3 py-1 rounded-lg ${viewingRecord.judgment === 'keep' ? 'bg-gray-100 text-gray-700' : 'bg-emerald-100 text-emerald-700'}`}>
                          {viewingRecord.judgment === 'keep' ? '🙋 처음 생각 그대로 유지' : '✏️ 의견 반영하여 추가/수정'}
                        </span>
                      </div>
                    </div>
                  </div>
                )}
              </div>
              
              <div className="p-5 sm:p-6 border-t bg-gray-50 flex justify-center">
                <button 
                  onClick={() => setViewingRecord(null)}
                  className="bg-gray-800 hover:bg-gray-900 text-white font-extrabold py-4 px-12 rounded-2xl shadow-md transition text-lg w-full max-w-xs"
                >
                  닫기
                </button>
              </div>
            </div>
          </div>
        )}
      </>
    );
  };
 
  return (
    <div className="min-h-screen bg-emerald-50/50 font-sans text-gray-800 pb-20">
      {renderTeacherModals()}
 
      {isTeacherMode ? (
        <div className="max-w-6xl mx-auto px-4 py-8 animate-fade-in-up">
          <TeacherDashboard />
        </div>
      ) : (
        <>
          <ProgressBar />
          
          <div className="max-w-4xl mx-auto px-4">
            <Header />
 
            {error && (
              <div className="bg-red-50 border-l-4 border-red-500 p-4 mb-6 rounded-r-xl shadow-sm animate-fade-in-up">
                <div className="flex items-center">
                  <span className="text-red-500 mr-2 text-xl">⚠️</span>
                  <p className="text-red-700 font-bold">{error}</p>
                </div>
              </div>
            )}
 
            {}
            {step === 1 && renderStep1()}
            {(step === 2 || step === 3) && renderStep2And3()}
            {step === 4 && renderStep4()}
            {step === 5 && renderStep5()}
            {step === 6 && renderStep6()}
          </div>
          
          {isLoading && (
            <div className="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-50 flex flex-col items-center justify-center p-4">
              <div className="bg-white p-8 rounded-3xl shadow-2xl flex flex-col items-center max-w-sm w-full text-center">
                <div className="w-16 h-16 border-4 border-emerald-200 border-t-emerald-600 rounded-full animate-spin mb-6"></div>
                <p className="text-xl font-extrabold text-gray-800 mb-2">{loadingMessage}</p>
                <p className="text-sm text-gray-500">잠시만 기다려주세요...</p>
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
};
 
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
